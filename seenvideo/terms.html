<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Terms of Service – SeenVideo</title>
    <meta
        name="description"
        content="Terms of Service for SeenVideo, an Android app that helps users track the watch status of YouTube videos."
    >

    <style>
        :root {
            color-scheme: light;
            --background: #f6f7f9;
            --surface: #ffffff;
            --text: #202124;
            --muted: #5f6368;
            --border: #dadce0;
            --accent: #1a73e8;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.65;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        article {
            background: var(--surface);
            padding: 42px;
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        h1 {
            margin-top: 0;
            font-size: 2.2rem;
            line-height: 1.2;
        }

        h2 {
            margin-top: 2.2rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid var(--border);
            font-size: 1.4rem;
        }

        h3 {
            margin-top: 1.5rem;
            font-size: 1.1rem;
        }

        p,
        li {
            font-size: 1rem;
        }

        .meta {
            color: var(--muted);
            margin-bottom: 2rem;
        }

        a {
            color: var(--accent);
        }

        .notice {
            padding: 16px 18px;
            margin: 20px 0;
            border-left: 4px solid var(--accent);
            background: #eef4ff;
            border-radius: 4px;
        }

        footer {
            max-width: 900px;
            margin: 24px auto 40px;
            padding: 0 20px;
            color: var(--muted);
            font-size: 0.9rem;
            text-align: center;
        }

        @media (max-width: 600px) {
            main {
                margin: 20px auto;
                padding: 0 12px;
            }

            article {
                padding: 24px 20px;
            }

            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
<main>
    <article>
        <h1>Terms of Service</h1>

        <p class="meta">
            <strong>App:</strong> SeenVideo<br>
            <strong>Effective date:</strong> September 12, 2026<br>
            <strong>Last updated:</strong> September 12, 2026
        </p>

        <p>
            No terms apply.
        </p>
    </article>
</main>

<footer>
    &copy; 2026 Sander Baas. All rights reserved.
</footer>
</body>
</html>
